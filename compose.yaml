name: delicity

services:
  database:
    image: delicity-database
    build:
      context: ./01_DB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  scripts:
    image: delicity-scripts
    build:
      context: .
      dockerfile: 04_Script/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    image: delicity-backend
    build:
      context: ./02_Back-End/ExpressStarterDCT
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      APP_NAME: ${APP_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      PERSISTENT_SESSION_TTL_DAYS: ${PERSISTENT_SESSION_TTL_DAYS}
    ports:
      - "3000:3000"
    depends_on:
      scripts:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          const response = await fetch('http://localhost:3000/health');
          process.exit(response.ok ? 0 : 1)
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: delicity-frontend
    build:
      context: ./03_Front-End
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
